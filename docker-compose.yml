services:
  memory-graph-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    environment:
      - MEMORY_DIR=/app/data
      - STORAGE_TYPE=sqlite
      - TRANSPORT_TYPE=HTTP
      - PORT=3838
      - HOST=0.0.0.0  # Bind on all interfaces so the published port is reachable
    ports:
      - "3838:3838"

